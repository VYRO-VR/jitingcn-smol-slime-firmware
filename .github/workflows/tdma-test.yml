name: TDMA test build (Mochi + Fox Dongle + Styria R1)

# Builds OFFICIAL SlimeVR tdma firmware for our hardware, for compatibility
# testing. Tracker and receiver both come from the official SlimeVR repos and
# use the SDK pinned by their own west.yml (SlimeVR/sdk-nrf v3.1-slimevr).
#
#   Mochi tracker      board already exists upstream (mocha-elec/mochi)
#   Fox Dongle         board dir overlaid from jitingcn receiver `dev`, ported
#                      from the v3.4 SDK to v3.1 (FEM compatible string, USB
#                      manufacturer/product Kconfig names)
#   Styria R1          board dir overlaid from jitingcn receiver `styria`
#                      (already v3.1-era)
#
# The overlay only adds board directories; no upstream firmware source is
# modified.

on:
  workflow_dispatch:
    inputs:
      tracker_ref:
        description: Official tracker branch, tag or SHA
        default: tdma
      receiver_ref:
        description: Official receiver branch, tag or SHA
        default: tdma

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target.filename }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - role: tracker
            board: "mochi_uf2/nrf52833"
            filename: "TDMA_Mochi_Tracker"
          - role: receiver
            board: "foxdongle_uf2/nrf52840"
            filename: "TDMA_FoxDongle_Receiver"
            overlay_repo: jitingcn/SlimeVR-Tracker-nRF-Receiver
            overlay_ref: dev
            overlay_src: boards/foxapplication/foxdongle_uf2
            overlay_dst: boards/foxapplication/foxdongle_uf2
            port_v34_to_v31: true
          - role: receiver
            board: "styria_r1_uf2/nrf52840"
            filename: "TDMA_Styria_R1_Receiver"
            overlay_repo: jitingcn/SlimeVR-Tracker-nRF-Receiver
            overlay_ref: styria
            overlay_src: boards/styria/styria_r1
            overlay_dst: boards/styria/styria_r1
    env:
      REPO: ${{ matrix.target.role == 'tracker' && 'SlimeVR/SlimeVR-Tracker-nRF' || 'SlimeVR/SlimeVR-Tracker-nRF-Receiver' }}
      REF: ${{ matrix.target.role == 'tracker' && inputs.tracker_ref || inputs.receiver_ref }}
    steps:
      - name: 💻 Checkout firmware source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.REF }}
          path: zephyr-workspace/app
          submodules: recursive

      - name: 💻 Checkout board overlay source
        if: matrix.target.overlay_repo
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.target.overlay_repo }}
          ref: ${{ matrix.target.overlay_ref }}
          path: board-overlay

      - name: 🧩 Overlay board definition
        if: matrix.target.overlay_repo
        run: |
          DST="zephyr-workspace/app/${{ matrix.target.overlay_dst }}"
          mkdir -p "$(dirname "$DST")"
          rm -rf "$DST"
          cp -r "board-overlay/${{ matrix.target.overlay_src }}" "$DST"
          echo "OVERLAY_SHA=$(git -C board-overlay rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 🩹 Port board from SDK v3.4 to v3.1
        if: matrix.target.port_v34_to_v31
        run: |
          D="zephyr-workspace/app/${{ matrix.target.overlay_dst }}"
          # v3.4 FEM binding name -> v3.1 name (same one holyiot_21017 uses upstream)
          sed -i 's/"radio-fem-two-ctrl-pins"/"generic-fem-two-ctrl-pins"/' "$D"/*.dts
          # Fork-only Kconfig names -> stock names used by upstream boards (e.g. etee)
          sed -i 's/CONFIG_SLIMEVR_USB_DEVICE_/CONFIG_USB_DEVICE_/' "$D"/*_defconfig
          grep -n -E "fem-two-ctrl-pins|USB_DEVICE_" "$D"/*.dts "$D"/*_defconfig

      - name: 🧰 Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-wheel python3-venv \
            xz-utils file make gcc gcc-multilib g++-multilib libmagic1

      - name: 📟 Resolve SDK pins from the app's own west.yml
        id: pins
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          W=zephyr-workspace/app/west.yml
          URL=$(yq -r '.manifest.projects[] | select(.name=="sdk-nrf") | .url' "$W")
          REV=$(yq -r '.manifest.projects[] | select(.name=="sdk-nrf") | .revision' "$W")
          COMMIT=$(git ls-remote "$URL" "$REV" | awk 'NR==1{print $1}')
          # Zephyr SDK version: prefer what the repo's own workflow uses.
          ZSDK=$(grep -h -m1 'ZEPHYR_SDK_VERSION:' zephyr-workspace/app/.github/workflows/*.yml 2>/dev/null | sed -E 's/.*"([^"]+)".*/\1/')
          ZSDK=${ZSDK:-0.17.4}
          echo "sdk-url=$URL" >> "$GITHUB_OUTPUT"
          echo "sdk-rev=$REV" >> "$GITHUB_OUTPUT"
          echo "sdk-commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "zsdk=$ZSDK" >> "$GITHUB_OUTPUT"
          echo "app-sha=$(git -C zephyr-workspace/app rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sdk-nrf: $URL @ $REV ($COMMIT), Zephyr SDK $ZSDK"

      - name: 📦 Cache Zephyr SDK
        id: cache-zsdk
        uses: actions/cache@v5
        with:
          path: ~/zephyr-sdk-${{ steps.pins.outputs.zsdk }}
          key: tdma-zsdk-${{ steps.pins.outputs.zsdk }}

      - name: 🪁 Install Zephyr SDK
        if: steps.cache-zsdk.outputs.cache-hit != 'true'
        run: |
          V=${{ steps.pins.outputs.zsdk }}
          FILE="zephyr-sdk-${V}_linux-x86_64_minimal.tar.xz"
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${V}/${FILE}"
          tar xf "$FILE" -C ~/
          ~/zephyr-sdk-${V}/setup.sh -c -t arm-zephyr-eabi

      - name: 🪁 Register Zephyr SDK
        run: |
          ~/zephyr-sdk-${{ steps.pins.outputs.zsdk }}/setup.sh -c -t arm-zephyr-eabi
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-${{ steps.pins.outputs.zsdk }}" >> "$GITHUB_ENV"

      - name: 🐍 Python venv + west
        run: |
          python3 -m venv ~/.venv
          ~/.venv/bin/pip install -q west ninja
          echo "$HOME/.venv/bin" >> "$GITHUB_PATH"

      - name: 📦 Cache west workspace
        id: cache-west
        uses: actions/cache@v5
        with:
          path: |
            zephyr-workspace/.west
            zephyr-workspace/zephyr
            zephyr-workspace/nrf
            zephyr-workspace/modules
            zephyr-workspace/nrfxlib
            zephyr-workspace/bootloader
            zephyr-workspace/tools
          key: tdma-west-${{ steps.pins.outputs.sdk-commit }}

      - name: ♻️ west init / update
        run: |
          cd zephyr-workspace
          [ -d .west ] || west init -l app
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: 🐍 Install NCS / Zephyr / MCUboot Python requirements
        run: |
          cd zephyr-workspace
          pip install -q \
            -r zephyr/scripts/requirements.txt \
            -r nrf/scripts/requirements-build.txt \
            -r bootloader/mcuboot/scripts/requirements.txt

      - name: 🔨 Build ${{ matrix.target.board }}
        run: |
          cd zephyr-workspace
          mkdir -p Releases
          west build \
            --board "${{ matrix.target.board }}" \
            --pristine=always app \
            --build-dir app/build \
            -- \
            -DNCS_TOOLCHAIN_VERSION=NONE \
            -DBOARD_ROOT=../app
          for ext in uf2 hex; do
            src="app/build/app/zephyr/zephyr.${ext}"
            [ -f "$src" ] && cp "$src" "Releases/${{ matrix.target.filename }}.${ext}" && echo "Saved: ${{ matrix.target.filename }}.${ext}"
          done
          ls Releases | grep -q . || { echo "No firmware produced" >&2; exit 1; }

      - name: 🧾 Record source revisions
        run: |
          {
            echo "### ${{ matrix.target.filename }}"
            echo "- source: \`${{ env.REPO }}\` @ \`${{ env.REF }}\` (\`${{ steps.pins.outputs.app-sha }}\`)"
            echo "- board: \`${{ matrix.target.board }}\`"
            [ -n "$OVERLAY_SHA" ] && echo "- board definition overlaid from \`${{ matrix.target.overlay_repo }}\` @ \`${{ matrix.target.overlay_ref }}\` (\`$OVERLAY_SHA\`)"
            echo "- sdk-nrf: ${{ steps.pins.outputs.sdk-url }} @ ${{ steps.pins.outputs.sdk-rev }} (\`${{ steps.pins.outputs.sdk-commit }}\`)"
            echo "- Zephyr SDK: ${{ steps.pins.outputs.zsdk }}"
          } | tee zephyr-workspace/Releases/${{ matrix.target.filename }}.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.filename }}
          if-no-files-found: error
          path: zephyr-workspace/Releases/${{ matrix.target.filename }}*
